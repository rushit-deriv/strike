<?xml version="1.0" encoding="UTF-8"?>
<svg width="92px" height="96px" viewBox="0 0 92 96" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Strike Ninja Hacker</title>
    <defs>
        <linearGradient id="ninjaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <g id="ninja-hacker" transform="translate(6, 8)">
        <!-- Ninja Hood/Head -->
        <path d="M40,5 C50,5 65,15 65,35 C65,45 60,55 55,60 L25,60 C20,55 15,45 15,35 C15,15 30,5 40,5 Z" 
              fill="url(#ninjaGradient)" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Hood Shadow -->
        <path d="M40,5 C50,5 65,15 65,35 C65,40 63,44 60,47 L55,45 C58,40 60,37 60,35 C60,18 50,10 40,10 C30,10 20,18 20,35 C20,37 22,40 25,45 L20,47 C17,44 15,40 15,35 C15,15 30,5 40,5 Z" 
              fill="#0f172a" opacity="0.6"/>
        
        <!-- Glowing Eyes -->
        <ellipse cx="32" cy="30" rx="4" ry="6" fill="url(#eyeGlow)" opacity="0.9">
            <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="48" cy="30" rx="4" ry="6" fill="url(#eyeGlow)" opacity="0.9">
            <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
        </ellipse>
        
        <!-- Eye Glow Effect -->
        <ellipse cx="32" cy="30" rx="6" ry="8" fill="url(#eyeGlow)" opacity="0.3">
            <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="48" cy="30" rx="6" ry="8" fill="url(#eyeGlow)" opacity="0.3">
            <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
        </ellipse>
        
        <!-- Face Mask -->
        <path d="M25,38 Q40,45 55,38 Q50,50 40,52 Q30,50 25,38 Z" 
              fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
        
        <!-- Shoulder/Body -->
        <path d="M15,60 Q25,65 40,65 Q55,65 65,60 L70,75 Q40,80 10,75 Z" 
              fill="url(#ninjaGradient)" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Tech Elements - Circuit Lines -->
        <g stroke="url(#accentGlow)" stroke-width="1" fill="none" opacity="0.7">
            <path d="M20,20 L25,25 L30,20"/>
            <path d="M50,20 L55,25 L60,20"/>
            <path d="M15,50 L20,55 L25,50"/>
            <path d="M55,50 L60,55 L65,50"/>
        </g>
        
        <!-- Tech Nodes -->
        <circle cx="22" cy="22" r="1.5" fill="url(#accentGlow)" opacity="0.8">
            <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="58" cy="22" r="1.5" fill="url(#accentGlow)" opacity="0.8">
            <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="17" cy="52" r="1.5" fill="url(#accentGlow)" opacity="0.8">
            <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="63" cy="52" r="1.5" fill="url(#accentGlow)" opacity="0.8">
            <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Subtle Lightning/Strike accent -->
        <path d="M40,15 L42,25 L38,25 L40,35" stroke="url(#accentGlow)" stroke-width="1" fill="none" opacity="0.4"/>
        
        <!-- Hood Edge Details -->
        <path d="M15,35 Q20,32 25,35" stroke="#334155" stroke-width="0.5" fill="none"/>
        <path d="M55,35 Q60,32 65,35" stroke="#334155" stroke-width="0.5" fill="none"/>
    </g>
</svg>